services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_DAYS: ${SESSION_DAYS:-30}
    volumes:
      - ./data:/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
